<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hacker Labs & Write-ups</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 700px;
            margin: 60px auto;
            padding: 0 20px;
        }

        h1 {
            color: #00ff66;
            font-family: monospace;
            border-bottom: 2px solid #30363d;
            padding-bottom: 12px;
            font-size: 1.8rem;
        }

        .subtitle {
            color: #8b949e;
            margin-bottom: 30px;
        }

        .grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 20px;
            transition: transform 0.2s, border-color 0.2s;
            text-decoration: none;
            display: block;
        }

        .card:hover {
            border-color: #00ff66;
            transform: translateY(-2px);
        }

        .card h2 {
            margin: 0 0 8px 0;
            color: #58a6ff;
            font-size: 1.3rem;
        }

        .card p {
            margin: 0;
            color: #8b949e;
            font-size: 0.95rem;
        }

        .tag {
            display: inline-block;
            background: #21262d;
            color: #00ff66;
            font-family: monospace;
            font-size: 0.8rem;
            padding: 3px 8px;
            border-radius: 4px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h1>> Hacker Labs Write-ups</h1>
    <p class="subtitle">Selecciona una máquina para ver la resolución detallada:</p>

    <div class="grid">
        <!-- Máquina 1: Shadows -->
        <a href="./writeup-Shadows/" class="card">
            <h2>Shadows</h2>
            <p>Seguridad Ofensiva, Windows, Active Directory</p>
            <span class="tag">[Ver Write-Up]</span>
        </a>

    </div>

</body>
</html>
